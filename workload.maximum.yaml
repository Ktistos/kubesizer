# Comprehensive single-traffic-model workload accepted by analytics,
# simulation, and calibration. Empirical source paths are relative to this file.
request_classes:
  interactive:
    concurrency_weight: 0.8
    # The latency boundary says exactly what the SLO clock observes. These
    # components are measured separately from application service demand.
    latency_boundary: external_client
    latency_components:
      client_to_ingress:
        distribution: empirical
        source: examples/workloads/data/client-to-ingress-times.csv
        column: latency_seconds
        sampling: iid_with_replacement
      ingress_processing:
        distribution: empirical
        source: examples/workloads/data/ingress-processing-times.csv
        column: latency_seconds
        sampling: iid_with_replacement
    end_to_end_latency_slos:
      percentile:
        quantile: 0.95
        maximum_seconds: 1.0
    routing:
      gateway:
        database: 0.25
        worker: 0.20
        cache: 0.15
        search: 0.15
        mailer: 0.10
      worker:
        database: 0.40
        audit: 0.10
      cache:
        database: 0.10
      search:
        database: 0.20
      mailer:
        audit: 0.10
      database:
        audit: 0.05

  batch:
    concurrency_weight: 0.2
    latency_boundary: ingress
    latency_components:
      ingress_processing:
        distribution: empirical
        source: examples/workloads/data/ingress-processing-times.csv
        column: latency_seconds
        sampling: iid_with_replacement
    end_to_end_latency_slos:
      percentile:
        quantile: 0.95
        maximum_seconds: 5.0
    routing:
      worker:
        database: 0.65
        audit: 0.20
      audit:
        worker: 0.05

traffic_model:
  # HTTP probes between application pods provide round-trip observations.
  # Normalize them to one-way values before exporting these two series. Before
  # node placement is known, the probability is the observed/estimated share
  # of service edges crossing nodes. A placement latency matrix supersedes this
  # mixture once concrete nodes are selected.
  communication_latency:
    same_node_one_way:
      distribution: empirical
      source: examples/workloads/data/same-node-one-way-times.csv
      column: latency_seconds
      sampling: iid_with_replacement
    cross_node_one_way:
      distribution: empirical
      source: examples/workloads/data/cross-node-one-way-times.csv
      column: latency_seconds
      sampling: iid_with_replacement
    unplaced_cross_node_probability: 0.65

  entry_services:
    interactive:
      gateway:
        distribution: exponential
        rate: 8.0
      cache:
        distribution: deterministic
        rate: 2.0
      search:
        distribution: gamma
        rate: 2.0
        scv: 3.0
      mailer:
        distribution: lognormal
        rate: 1.0
        scv: 2.0
      database:
        distribution: empirical_interarrival
        source: examples/workloads/data/interactive-gateway-interarrivals.csv
        column: interarrival_seconds
        sampling: iid_with_replacement
    batch:
      worker:
        distribution: weibull
        rate: 3.0
        shape: 0.9
      audit:
        distribution: arrival_trace
        source: examples/workloads/data/interactive-gateway-arrival-trace.csv
        timestamp_column: arrival_offset_seconds
        sampling: block_bootstrap
        block_duration: 10.0

  service_times:
    gateway:
      execution_model: processor_sharing
      concurrency_limit_per_replica: 32
      # Low-load non-CPU wait (for example I/O or lock delay). CPU is released
      # during this interval, but one of the 32 admitted-concurrency slots is
      # retained. Exclude downstream calls and network delay modeled elsewhere.
      non_cpu_blocking_time:
        distribution: deterministic
        mean: 0.003
      distribution: exponential
      rate: 50.0
    database:
      # Kubernetes replicas normally have separate queues. Round-robin keeps a
      # visit on the selected replica instead of granting it pooled capacity.
      replica_queue_model: independent_round_robin
      distribution: empirical
      source: examples/workloads/data/database-service-times.csv
      column: service_time_seconds
      sampling: iid_with_replacement
    worker:
      distribution: gamma
      mean: 0.050
      scv: 1.5
    cache:
      distribution: deterministic
      mean: 0.0125
    search:
      distribution: lognormal
      mean: 0.040
      scv: 2.0
    mailer:
      distribution: weibull
      mean: 0.060
      shape: 1.4
    audit:
      distribution: exponential
      rate: 40.0

  # Optional joint input uncertainty. Each epoch is one aligned measurement
  # window; the native kernel samples consecutive windows as one block so a
  # high-arrival/high-demand regime is never recombined with an unrelated one.
  input_uncertainty:
    sampling: moving_block_bootstrap
    block_length: 2
    epochs:
      - arrival_rate_multipliers: {interactive: 0.80, batch: 0.85}
        service_time_multipliers:
          {gateway: 0.90, database: 0.90, worker: 0.85, cache: 0.90,
           search: 0.90, mailer: 0.85, audit: 0.90}
      - arrival_rate_multipliers: {interactive: 1.00, batch: 1.00}
        service_time_multipliers:
          {gateway: 1.00, database: 1.00, worker: 1.00, cache: 1.00,
           search: 1.00, mailer: 1.00, audit: 1.00}
      - arrival_rate_multipliers: {interactive: 1.25, batch: 1.20}
        service_time_multipliers:
          {gateway: 1.10, database: 1.15, worker: 1.20, cache: 1.05,
           search: 1.15, mailer: 1.20, audit: 1.10}
