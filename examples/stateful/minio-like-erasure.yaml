# Synthetic mechanism example; all demands/rates are illustrative, not measurements.
# Fixed members define one resolved topology. No product-level accuracy is claimed.
# This toy 4-member, 3-response rule is supplied explicitly; it is not a MinIO adapter.
request_classes:
  put_small:
    concurrency_weight: 1
    calls:
      api:
        encoding: 1
      encoding:
        member_1: 1
        member_2: 1
        member_3: 1
        member_4: 1
      member_1:
        disk_1: 1
      member_2:
        disk_2: 1
      member_3:
        disk_3: 1
      member_4:
        disk_4: 1
    call_execution: "sequential"
    call_policies:
      encoding:
        execution: "parallel"
        completion: "quorum"
        required: 3
    end_to_end_latency_slos:
      mean_seconds: 0.1
traffic_model:
  entry_services:
    put_small:
      api:
        distribution: "exponential"
        rate: 10
  service_times:
    api:
      distribution: "deterministic"
      mean: 0.001
      concurrency_limit_per_replica: 64
    encoding:
      distribution: "deterministic"
      mean: 0.003
      concurrency_limit_per_replica: 64
    member_1:
      distribution: "deterministic"
      mean: 0.001
      concurrency_limit_per_replica: 64
    member_2:
      distribution: "deterministic"
      mean: 0.001
      concurrency_limit_per_replica: 64
    member_3:
      distribution: "deterministic"
      mean: 0.001
      concurrency_limit_per_replica: 64
    member_4:
      distribution: "deterministic"
      mean: 0.001
      concurrency_limit_per_replica: 64
    disk_1:
      distribution: "deterministic"
      mean: 0.004
      concurrency_limit_per_replica: 64
    disk_2:
      distribution: "deterministic"
      mean: 0.004
      concurrency_limit_per_replica: 64
    disk_3:
      distribution: "deterministic"
      mean: 0.006
      concurrency_limit_per_replica: 64
    disk_4:
      distribution: "deterministic"
      mean: 0.01
      concurrency_limit_per_replica: 64
replica_constraints:
  api:
    minimum: 1
    maximum: 4
  encoding:
    fixed: 1
  member_1:
    fixed: 1
  member_2:
    fixed: 1
  member_3:
    fixed: 1
  member_4:
    fixed: 1
  disk_1:
    fixed: 1
  disk_2:
    fixed: 1
  disk_3:
    fixed: 1
  disk_4:
    fixed: 1
