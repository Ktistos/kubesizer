# Synthetic broker admission/prefetch abstraction; no broker product protocol.
replica_constraints:
  broker: {fixed: 1}
  worker: {minimum: 1, maximum: 3}
request_classes:
  job:
    concurrency_weight: 1
    completion_boundary: all_work
    maximum_terminal_failure_rate: 0.02
    end_to_end_latency_slos: {mean_seconds: 0.2}
    stage_workflow:
      entries: {broker: publish}
      stages:
        publish:
          resource: broker
          service_time: {distribution: deterministic, mean: 0.001}
          calls: {consume: 1}
          call_policy: {completion: background}
        consume:
          resource: worker
          service_time: {distribution: exponential, rate: 100}
          non_cpu_blocking_time: {distribution: deterministic, mean: 0.02}
traffic_model:
  entry_services:
    job:
      broker: {distribution: exponential, rate: 5}
  service_times:
    broker:
      concurrency_limit_per_replica: 1
      admission_queue: {capacity_per_replica: 256}
    worker:
      processing_slots_per_replica: 2
      concurrency_limit_per_replica: 8
      admission_queue: {capacity_per_replica: 256, timeout_seconds: 1}
