# Synthetic measured-key workload; FNV-1a modulo replicas, not Redis routing.
replica_constraints:
  cache: {minimum: 1, maximum: 2}
  backend: {minimum: 1, maximum: 2}
request_classes:
  lookup:
    concurrency_weight: 1
    end_to_end_latency_slos: {mean_seconds: 0.1}
    stage_workflow:
      entries: {cache: lookup}
      stages:
        lookup:
          resource: cache
          service_time: {distribution: deterministic, mean: 0.001}
          cache: {miss: backend, fill_on_miss: true}
        backend:
          resource: backend
          service_time: {distribution: exponential, rate: 50}
traffic_model:
  entry_services:
    lookup:
      cache: {distribution: exponential, rate: 5}
  service_times:
    cache:
      replica_queue_model: independent_key_hash
      cache:
        mode: lru
        capacity_bytes_per_replica: 2048
        ttl_seconds: 10
        key_sizes_bytes: {a: 1024, b: 1024, c: 1024}
        accesses_by_class:
          lookup: {sampling: iid, keys: [a, a, a, b, c]}
    backend: {}
