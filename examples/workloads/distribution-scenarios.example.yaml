# Generalized distributions and robust scenarios accepted by the analytical
# layer, native simulator, and calibration workflow.
schema_version: 2
time_unit: seconds

request_classes:
  interactive:
    routing:
      gateway:
        database: 0.65
        worker: 0.25
      worker:
        database: 0.40

  batch:
    routing:
      worker:
        database: 0.80

scenarios:
  baseline_exponential:
    entry_services:
      interactive:
        gateway:
          distribution: exponential
          rate: 16.0
      batch:
        worker:
          distribution: exponential
          rate: 4.0
    service_times:
      gateway:
        distribution: exponential
        rate: 50.0
      database:
        distribution: exponential
        rate: 10.0
      worker:
        distribution: exponential
        rate: 20.0

  variable_parametric:
    entry_services:
      interactive:
        gateway:
          distribution: gamma
          rate: 16.0
          scv: 3.0
      batch:
        worker:
          distribution: deterministic
          rate: 4.0
    service_times:
      gateway:
        distribution: deterministic
        mean: 0.020
      database:
        distribution: lognormal
        mean: 0.100
        scv: 5.0
      worker:
        distribution: weibull
        mean: 0.050
        shape: 1.4

  empirical_iid:
    entry_services:
      interactive:
        gateway:
          distribution: empirical_interarrival
          source: data/interactive-gateway-interarrivals.csv
          column: interarrival_seconds
          sampling: iid_with_replacement
      batch:
        worker:
          distribution: gamma
          rate: 4.0
          scv: 1.5
    service_times:
      gateway:
        distribution: exponential
        rate: 50.0
      database:
        distribution: empirical
        source: data/database-service-times.csv
        column: service_time_seconds
        sampling: iid_with_replacement
      worker:
        distribution: gamma
        mean: 0.050
        scv: 1.5

  correlated_arrival_trace:
    entry_services:
      interactive:
        gateway:
          distribution: arrival_trace
          source: data/interactive-gateway-arrival-trace.csv
          timestamp_column: arrival_offset_seconds
          sampling: block_bootstrap
          block_duration: 10.0
      batch:
        worker:
          distribution: weibull
          rate: 4.0
          shape: 0.9
    service_times:
      gateway:
        distribution: lognormal
        mean: 0.020
        scv: 2.0
      database:
        distribution: empirical
        source: data/database-service-times.csv
        column: service_time_seconds
        sampling: iid_with_replacement
      worker:
        distribution: deterministic
        mean: 0.050
