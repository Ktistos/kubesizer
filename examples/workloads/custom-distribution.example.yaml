# Custom samplers are native shared libraries and execute inside the simulator
# subprocess. Only load trusted plugins. Build the bundled example first with:
#
#   native_backend/cpp/build.sh
#
# A custom sampler returns a positive dimensionless multiplier with mean 1.
# The backend multiplies it by the declared interarrival/service-time mean.
request_classes:
  interactive:
    concurrency_weight: 0.8
    end_to_end_latency_slos:
      percentile:
        quantile: 0.95
        maximum_seconds: 1.0
    routing:
      gateway:
        worker: 0.25
  batch:
    concurrency_weight: 0.2
    end_to_end_latency_slos:
      percentile:
        quantile: 0.95
        maximum_seconds: 5.0
    routing: {}

traffic_model:
  entry_services:
    interactive:
      gateway:
        distribution: custom
        rate: 8.0
        scv: 0.5
        library: ../../native_backend/cpp/build-release/libkubesizer-example-distributions.so
        symbol: kubesizer_two_point_multiplier
        abi_version: 1
        # [low multiplier, high multiplier, probability of low]
        parameters: [0.5, 2.0, 0.6666666666666666]
    batch:
      worker:
        distribution: exponential
        rate: 2.0
  service_times:
    gateway:
      distribution: custom
      mean: 0.02
      scv: 0.0
      library: ../../native_backend/cpp/build-release/libkubesizer-example-distributions.so
      symbol: kubesizer_unit_multiplier
      abi_version: 1
      parameters: []
    worker:
      distribution: custom
      mean: 0.05
      scv: 0.5
      library: ../../native_backend/cpp/build-release/libkubesizer-example-distributions.so
      symbol: kubesizer_two_point_multiplier
      abi_version: 1
      parameters: [0.5, 2.0, 0.6666666666666666]
