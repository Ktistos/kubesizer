request_classes:
  browse:
    concurrency_weight: 1.0
    entry_services:
      api: 1.0
    calls:
      api:
        database: 1.2
    call_execution: sequential
    end_to_end_latency_slos:
      mean_seconds: 0.25

# Engineering headroom for the confidence-bounded stability floor. This is a
# capacity ratio, not observed CPU utilization. Lower values require at least
# as many replicas and reserve more capacity for variation.
sizing_policy:
  maximum_capacity_utilization: 0.85

# Optional, inferred only from a low-load aligned observation after subtracting
# CPU execution, modeled downstream response, and communication round trips.
# It releases CPU but retains one configured service-concurrency slot.
# service_blocking_times:
#   api:
#     distribution: deterministic
#     mean: 0.006

# Optional forecast envelope. Kubesizer sizes and certifies the largest
# multiplier; retain 1.0 to include the measured workload as a reference.
# load_forecast:
#   multipliers: [1.0, 1.25, 1.5]
