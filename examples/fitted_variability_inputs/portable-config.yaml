# Measurement context and mapping between client operations and request classes.
measurement:
  prometheus_url: http://127.0.0.1:9090
  namespace: kubesizer-rich-same-node-chain-20260901
  warmup_seconds: 60
  measurement_seconds: 300
  stable_window_seconds: 30
  external_entry_workloads:
    - network-front
  cpu_capacity_source: limit
  application_containers:
    - application

load:
  base_url: https://application.example
  warmup_seconds: 60
  measurement_seconds: 300
  random_seed: 2033100000
  request_classes:
    - name: network_request
      arrival_rate_rps: 10.0
      max_in_flight: 2000
      entry_workloads:
        - network-front
      end_to_end_latency_slos:
        mean_seconds: 0.13
      interarrival:
        distribution: exponential
      operations:
        - name: work
          method: GET
          path: /work
          weight: 1
