method: retained-low-load-characterization-to-heldout-native-simulation
analysis_source:
  path: /tmp/kubesizer-analysis-0DDNoY.yaml
  origin: ssh://experiment@46.224.93.195/home/experiment/experiments/deployment-family-sizing-validation-20260827/analysis.yaml
  sha256: 45455eaef8cfd8f293b4a7caeea34b15beb1e1da806340708a91234305c6b2cd
  plan_fingerprint: b3dbd887f2d4fe4d7a403d19ed69676c47b12a0d16a770c11e8b02d9ca2729c7
simulation_design:
  replications: 30
  warmup_duration_seconds: 60.0
  measurement_duration_seconds: 120.0
  common_random_numbers_across_models: true
  bootstrap_resample_count: 20000
  latency_statistic: pooled mean with replication-cluster bootstrap
model_semantics:
  baseline_fixed_overhead: existing synthetic workload with privileged processing-occupancy
    distribution and fitted fixed request overhead
  telemetry_cpu_blocking: measured CPU demand as processor-sharing work plus deterministic
    low-load Istio residual as non-CPU blocking; blocking retains the declared admission-concurrency
    slot
  telemetry_cpu_blocking_declared_bottleneck: the telemetry CPU-plus-blocking model
    with the synthetic application's declared narrow processing-pool size used as
    the blocking concurrency limit
  telemetry_blocking_fitted_variability: declared-bottleneck telemetry model with
    leaf blocking lognormal SCV fitted from low-load Istio mean and p50
  oracle_occupancy_blocking: privileged synthetic processing-occupancy distribution
    plus only the remaining low-load Istio residual as blocking
limitations:
- service blocking tails are not identifiable and are deterministic
- parallel child maximum is approximated by the maximum child mean
- predicted intervals include simulation randomness but not characterization uncertainty
- telemetry cannot identify a hidden serial non-CPU processing semaphore
- declared-bottleneck results require application/deployment concurrency configuration
  which counters alone do not reveal
- fitted blocking variability assumes a lognormal leaf residual and does not subtract
  independently aggregated percentiles
- oracle_occupancy_blocking uses synthetic ground truth unavailable on a general deployment
