          rate: 23.1
      write_heavy:
        api:
          distribution: exponential
          rate: 6.6
      compute_heavy:
        api:
          distribution: exponential
          rate: 3.3

    service_times:
      api:
        distribution: exponential
        rate: 100.0
      auth:
        distribution: exponential
        rate: 50.0
      db:
        distribution: exponential
        rate: 5.0
      cache:
        distribution: exponential
        rate: 80.0
      worker:
        distribution: exponential
        rate: 50.0
