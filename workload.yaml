schema_version: 2
time_unit: seconds

request_classes:
  read_heavy:
    concurrency_weight: 0.7
    routing:
      api:
        auth: 0.2
        db: 0.6
        cache: 0.1
        worker: 0.05
      auth:
        db: 0.8
        cache: 0.05
      db:
        cache: 0.05
      cache:
        worker: 0.05
      worker:
        db: 0.8
        cache: 0.05

  write_heavy:
    concurrency_weight: 0.2
    routing:
      api:
        auth: 0.15
        db: 0.45
        worker: 0.3
      auth:
        db: 0.7
        worker: 0.2
      db:
        worker: 0.2
      worker:
        db: 0.1

  compute_heavy:
    concurrency_weight: 0.1
    routing:
      api:
        auth: 0.1
        worker: 0.8
      auth:
        worker: 0.85
      worker:
        cache: 0.25
        db: 0.1
      cache:
        db: 0.05

scenarios:
