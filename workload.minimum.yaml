# Smallest versioned workload accepted by the current analytical and C++ paths.
request_classes:
  request:
    concurrency_weight: 1.0
    routing: {}

traffic_model:
  entry_services:
    request:
      service:
        distribution: exponential
        rate: 1.0
  service_times:
    service:
      distribution: exponential
      rate: 2.0
